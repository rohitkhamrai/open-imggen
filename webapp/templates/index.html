<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaivBharathi Pooja Cards</title>
    <style>
        :root {
            --primary: #d35400;
            --bg: #1a1a1a;
            --surface: #2d2d2d;
            --text: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1200px;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        .input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        input[type="text"] {
            flex: 1;
            padding: 1rem;
            border: 1px solid #444;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 1.1rem;
        }
        button {
            padding: 1rem 2rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .progress-container {
            display: none;
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .status-text {
            margin-bottom: 1rem;
            font-weight: bold;
            color: var(--primary);
        }
        .progress-bar {
            height: 12px;
            background: #111;
            border-radius: 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.1s linear;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .gallery img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .gallery img:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>DaivBharathi Generator</h1>
        <p>Pooja Sites & Yajna Style Card Creator</p>
    </div>

    <div class="input-group">
        <input type="text" id="prompt" placeholder="e.g. Durga Pooja invitation card, glowing diyas..." value="Yajna invitation card">
        <button id="generateBtn" onclick="generate()">Generate Options</button>
    </div>

    <div class="progress-container" id="progressContainer">
        <div class="status-text" id="statusText">Connecting to Ubuntu Server GPU...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="gallery" id="gallery"></div>
</div>

<script>
    function uuidv4() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    const clientId = uuidv4();
    const serverIp = "{{ server_ip }}";
    const ws = new WebSocket(`ws://${serverIp}:8188/ws?clientId=${clientId}`);
    
    let currentPromptId = null;

    ws.onmessage = function(event) {
        if(typeof event.data === "string") {
            const data = JSON.parse(event.data);
            if(data.type === "execution_start") {
                document.getElementById('statusText').innerText = "Initializing Z-Img Turbo GGUF...";
                document.getElementById('progressFill').style.width = "5%";
            }
            if(data.type === "executing") {
                if(data.data.node) {
                    document.getElementById('statusText').innerText = `Processing Node: ${data.data.node}`;
                } else {
                    document.getElementById('statusText').innerText = "Finalizing Images...";
                    document.getElementById('progressFill').style.width = "100%";
                }
            }
            if(data.type === "progress") {
                const perc = (data.data.value / data.data.max) * 100;
                document.getElementById('statusText').innerText = `Sampling Image... ${Math.round(perc)}%`;
                document.getElementById('progressFill').style.width = perc + "%";
            }
            if(data.type === "executed") {
                if(data.data.prompt_id === currentPromptId) {
                    fetchImages(currentPromptId);
                }
            }
        }
    };

    async function generate() {
        const btn = document.getElementById('generateBtn');
        const promptText = document.getElementById('prompt').value;
        
        btn.disabled = true;
        document.getElementById('gallery').innerHTML = "";
        document.getElementById('progressContainer').style.display = "block";
        document.getElementById('progressFill').style.width = "0%";
        document.getElementById('statusText').innerText = "Sending to server...";

        const res = await fetch("/api/generate", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ prompt: promptText, client_id: clientId })
        });
        
        const data = await res.json();
        currentPromptId = data.prompt_id;
    }

    async function fetchImages(promptId) {
        const res = await fetch(`/api/history/${promptId}`);
        const data = await res.json();
        const history = data[promptId];
        
        document.getElementById('statusText').innerText = "Done!";
        const btn = document.getElementById('generateBtn');
        btn.disabled = false;
        
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = "";

        if(history && history.outputs) {
            for(const nodeId in history.outputs) {
                const nodeOutput = history.outputs[nodeId];
                if(nodeOutput.images) {
                    nodeOutput.images.forEach(img => {
                        const imgEl = document.createElement("img");
                        imgEl.src = `/view/${img.filename}`;
                        gallery.appendChild(imgEl);
                    });
                }
            }
        }
    }
</script>

</body>
</html>
